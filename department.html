<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="page-title">Pathway | Walton CTAE</title>
  <meta name="description" id="page-description" content="Course progression pathway — Walton CTAE.">
  <link rel="icon" type="image/png" href="/images/uploads/logo.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header class="site-header">
    <div id="site-header"></div>
  </header>

  <div id="dept-content"></div>

  <footer class="site-footer">
    <div id="site-footer"></div>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/common.js"></script>
  <script src="js/flowchart.js"></script>
  <script>
    (async () => {
    const params = new URLSearchParams(window.location.search);
    const slug = params.get("dept");
    const content = document.getElementById("dept-content");

    if (!slug || !CTAE_DEPARTMENTS.includes(slug)) {
      await renderSiteChrome(null);
      content.innerHTML = `
        <div class="not-found container">
          <h1>Pathway not found</h1>
          <p>We couldn't find that CTAE pathway.</p>
          <a class="btn btn-primary" href="index.html">Back to Home</a>
        </div>
      `;
    } else {
      const allDepts = await renderSiteChrome(slug);
      const dept = allDepts[slug];

      document.getElementById("page-title").textContent = dept.name + " | Walton CTAE";
      document.getElementById("page-description").setAttribute("content", dept.tagline);

      const otherPathways = CTAE_DEPARTMENTS.filter((s) => s !== slug)
        .map((s) => {
          const d = allDepts[s];
          return `<a class="other-pathway-pill" href="department.html?dept=${s}">${d.icon} ${d.name}</a>`;
        })
        .join("");

      const courseDetailsHtml = (dept.pathway.courses || [])
        .map((c) => {
          const teachersHtml =
            c.teachers && c.teachers.length
              ? `<div class="course-detail-teachers">
                   <span class="course-detail-teachers-label">Teachers:</span>
                   ${c.teachers
                     .map(
                       (t) => `
                     <span class="course-detail-teacher">
                       ${
                         t.photo
                           ? `<img class="teacher-avatar-img-sm" src="${t.photo}" alt="${t.name}">`
                           : `<span class="teacher-avatar-sm">${t.name === "TBD" ? "?" : t.name.charAt(0)}</span>`
                       }
                       ${t.name}
                     </span>
                   `
                     )
                     .join("")}
                 </div>`
              : "";
          const prereqHtml =
            c.prerequisites && c.prerequisites.length
              ? `<div class="course-detail-prereq">Requires ${
                  c.prereqLogic === "any" && c.prerequisites.length > 1
                    ? c.prerequisites.join(" or ")
                    : c.prerequisites.join(" + ")
                }</div>`
              : "";
          const tagHtml = c.tag
            ? `<span class="course-detail-tag">${c.tag}</span>`
            : "";
          const videoId = c.videoUrl ? youTubeIdFromUrl(c.videoUrl) : null;
          const videoHtml = videoId
            ? `<div class="course-detail-video">
                 <iframe src="https://www.youtube.com/embed/${videoId}" title="${c.title} video"
                         loading="lazy" allowfullscreen
                         allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"></iframe>
               </div>`
            : "";
          return `
            <div class="course-detail" id="course-${slugify(c.title)}" style="--accent:${dept.accent}">
              <div class="course-detail-meta">
                <span class="course-detail-grades">Grades ${c.grades}</span>
                ${tagHtml}
              </div>
              <h3>${c.title}</h3>
              ${prereqHtml}
              <p class="course-detail-desc">${c.desc}</p>
              ${teachersHtml}
              ${videoHtml}
            </div>
          `;
        })
        .join("");

      content.innerHTML = `
        <section class="hero dept-hero" style="--accent:${dept.accent}">
          <div class="container">
            <h1><span class="hero-icon">${dept.icon}</span>${dept.name}</h1>
            <p class="lede">${dept.tagline}</p>
          </div>
        </section>

        <section>
          <div class="container">
            <p class="dept-description">${dept.description}</p>

            <div class="teachers-grid" style="--accent:${dept.accent}">
              ${(dept.teachers || [])
                .map(
                  (t) => `
                <div class="teacher-card">
                  ${
                    t.photo
                      ? `<img class="teacher-avatar-img" src="${t.photo}" alt="${t.name}">`
                      : `<div class="teacher-avatar">${t.name === "TBD" ? "?" : t.name.charAt(0)}</div>`
                  }
                  <div>
                    <div class="teacher-name">${t.name}</div>
                    <div class="teacher-meta">${t.email}</div>
                    <div class="teacher-meta">Room: ${t.room}</div>
                  </div>
                </div>
              `
                )
                .join("")}
            </div>
          </div>
        </section>

        <section class="section-alt">
          <div class="container">
            <h2 class="section-title">Course Progression</h2>
            <p class="section-lede">Follow the ${dept.name} pathway below — arrows show which course(s) must come before another. Some courses can be reached more than one way.</p>
            <div class="flowchart-wrap" id="flowchart"></div>
          </div>
        </section>

        <section>
          <div class="container">
            <h2 class="section-title">Course Details</h2>
            <div class="course-detail-list">${courseDetailsHtml}</div>
          </div>
        </section>

        <section class="section-alt">
          <div class="container">
            <h2 class="section-title">Explore Other Pathways</h2>
            <div class="other-pathways">${otherPathways}</div>
          </div>
        </section>
      `;

      renderFlowchart(document.getElementById("flowchart"), dept.pathway, dept.accent);
    }
    })();
  </script>
</body>
</html>
