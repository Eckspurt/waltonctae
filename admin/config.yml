# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Eckspurt/waltonctae
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2e2541f7-2877-4e5e-a613-9064c51bfedf/pkce
  auth_token_endpoint: /sites/2e2541f7-2877-4e5e-a613-9064c51bfedf/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Better Decap + Bridge logo (optional)
logo_url: https://decapbridge.com/decapcms-with-bridge.svg

# Add site links in Decap CMS (optional)
site_url: https://waltonctae.netlify.app

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "departments"
    label: "CTAE Departments"
    files:
      - name: "broadcasting"
        label: "Broadcasting"
        file: "content/departments/broadcasting.json"
        fields: &deptFields
          - { label: "Department Name", name: "name", widget: "string" }
          - { label: "Icon (emoji)", name: "icon", widget: "string" }
          - { label: "Accent Color", name: "accent", widget: "color" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Instructor"
            name: "instructor"
            widget: "object"
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Room", name: "room", widget: "string" }
          - label: "Pathway"
            name: "pathway"
            widget: "object"
            fields:
              - { label: "Pathway Name", name: "name", widget: "string" }
              - label: "Course Sequence"
                name: "sequence"
                widget: "list"
                summary: "{{title}} (Grades {{grades}})"
                fields:
                  - { label: "Course Title", name: "title", widget: "string" }
                  - { label: "Grades", name: "grades", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
              - label: "Electives & Capstone Options"
                name: "electives"
                widget: "list"
                summary: "{{title}}"
                fields:
                  - { label: "Title", name: "title", widget: "string" }
                  - { label: "Grades", name: "grades", widget: "string" }
                  - { label: "Note", name: "note", widget: "string" }

      - name: "business"
        label: "Business"
        file: "content/departments/business.json"
        fields: *deptFields

      - name: "computer-science"
        label: "Computer Science"
        file: "content/departments/computer-science.json"
        fields: *deptFields

      - name: "engineering"
        label: "Engineering"
        file: "content/departments/engineering.json"
        fields: *deptFields

      - name: "graphic-arts"
        label: "Graphic Arts"
        file: "content/departments/graphic-arts.json"
        fields: *deptFields

      - name: "healthcare-science"
        label: "Healthcare Science"
        file: "content/departments/healthcare-science.json"
        fields: *deptFields
