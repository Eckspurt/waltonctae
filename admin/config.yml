# Use DecapBridge PKCE auth (required)
backend:
  name: git-gateway
  repo: Eckspurt/waltonctae
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/2e2541f7-2877-4e5e-a613-9064c51bfedf/pkce
  auth_token_endpoint: /sites/2e2541f7-2877-4e5e-a613-9064c51bfedf/token
  gateway_url: https://gateway.decapbridge.com

  # See who did what (optional)
  commit_messages:
    create: Create {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    update: Update {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    delete: Delete {{collection}} "{{slug}}" - {{author-name}} <{{author-login}}> via DecapBridge
    uploadMedia: Upload "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    deleteMedia: Delete "{{path}}" - {{author-name}} <{{author-login}}> via DecapBridge
    openAuthoring: Message {{message}} - {{author-name}} <{{author-login}}> via DecapBridge

# Enable PKCE fields (optional, recommended)
auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

# Walton CTAE logo on the CMS login screen (optional)
logo_url: https://waltonctae.pages.dev/images/uploads/logo.png

# Add site links in Decap CMS (optional)
site_url: https://waltonctae.pages.dev

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "departments"
    label: "CTAE Departments"
    files:
      - name: "broadcasting"
        label: "Broadcasting"
        file: "content/departments/broadcasting.json"
        fields: &deptFields
          - { label: "Department Name", name: "name", widget: "string" }
          - { label: "Icon (emoji)", name: "icon", widget: "string" }
          - { label: "Accent Color", name: "accent", widget: "color" }
          - { label: "Tagline", name: "tagline", widget: "string" }
          - { label: "Description", name: "description", widget: "text" }
          - label: "Pathway Teachers"
            name: "teachers"
            widget: "relation"
            collection: "site-content"
            file: "teachers"
            search_fields: ["teachers.*.name"]
            display_fields: ["teachers.*.name"]
            value_field: "teachers.*.name"
            multiple: true
            hint: "Everyone who teaches somewhere in this pathway. To add someone new, add them under Sitewide Content → Teachers first."
          - label: "Pathway"
            name: "pathway"
            widget: "object"
            fields:
              - { label: "Pathway Name", name: "name", widget: "string" }
              - label: "Courses"
                name: "courses"
                widget: "list"
                summary: "{{title}} (Grades {{grades}})"
                fields:
                  - label: "Course Title"
                    name: "title"
                    widget: "string"
                    hint: "Must be unique within this pathway — other courses refer to it by this exact title as a prerequisite."
                  - { label: "Grades", name: "grades", widget: "string" }
                  - { label: "Description", name: "desc", widget: "text" }
                  - label: "Teachers for this course"
                    name: "teachers"
                    widget: "relation"
                    collection: "site-content"
                    file: "teachers"
                    search_fields: ["teachers.*.name"]
                    display_fields: ["teachers.*.name"]
                    value_field: "teachers.*.name"
                    multiple: true
                    required: false
                    hint: "Optional — only add someone here if they teach this specific course and aren't already listed as a general Pathway Teacher above."
                  - label: "YouTube Video URL"
                    name: "videoUrl"
                    widget: "string"
                    required: false
                    hint: "Paste a link like https://www.youtube.com/watch?v=... or https://youtu.be/... Leave blank for no video."
                  - label: "Prerequisites"
                    name: "prerequisites"
                    widget: "list"
                    required: false
                    hint: "Type the exact title of each course from this pathway that must be completed first. Leave empty if there's no prerequisite. Click \"Add\" for each one — don't separate multiple titles with commas, since a comma in a course's own title would get split apart."
                    field:
                      label: "Course Title"
                      name: "title"
                      widget: "string"
                  - label: "If more than one prerequisite, are they..."
                    name: "prereqLogic"
                    widget: "select"
                    required: false
                    default: "all"
                    options:
                      - { label: "All required", value: "all" }
                      - { label: "Any one of them", value: "any" }
                  - label: "Tag (optional badge)"
                    name: "tag"
                    widget: "string"
                    required: false
                    hint: "e.g. Elective, Capstone option, Certification option"
          - label: "Clubs & Related Organizations (this pathway only)"
            name: "clubs"
            widget: "list"
            required: false
            summary: "{{name}}"
            hint: "Shows as clickable tiles below Course Progression; each links down to its full details further down the page. For a club shared across every pathway (e.g. NTHS), use \"Clubs & Organizations (All Pathways)\" instead, under Sitewide Content."
            fields: &clubFields
              - { label: "Club/Organization Name", name: "name", widget: "string" }
              - { label: "Icon (emoji)", name: "icon", widget: "string", required: false }
              - { label: "Short Tagline", name: "tagline", widget: "string", required: false, hint: "One line, shown on the tile." }
              - { label: "Meeting Info", name: "meetingInfo", widget: "string", required: false, hint: "e.g. Thursdays, 3:30–5:00 PM, Room 119" }
              - { label: "Description", name: "description", widget: "text" }
              - { label: "Website", name: "website", widget: "string", required: false, hint: "Optional link to the club/organization's own website, e.g. https://example.org" }
              - label: "Advisors"
                name: "advisors"
                widget: "relation"
                collection: "site-content"
                file: "teachers"
                search_fields: ["teachers.*.name"]
                display_fields: ["teachers.*.name"]
                value_field: "teachers.*.name"
                multiple: true
                required: false

      - name: "business"
        label: "Business"
        file: "content/departments/business.json"
        fields: *deptFields

      - name: "computer-science"
        label: "Computer Science"
        file: "content/departments/computer-science.json"
        fields: *deptFields

      - name: "engineering"
        label: "Engineering"
        file: "content/departments/engineering.json"
        fields: *deptFields

      - name: "graphic-arts"
        label: "Graphic Arts"
        file: "content/departments/graphic-arts.json"
        fields: *deptFields

      - name: "healthcare-science"
        label: "Healthcare Science"
        file: "content/departments/healthcare-science.json"
        fields: *deptFields

  - name: "site-content"
    label: "Sitewide Content"
    files:
      - name: "teachers"
        label: "Teachers"
        file: "content/teachers.json"
        fields:
          - label: "Teachers"
            name: "teachers"
            widget: "list"
            summary: "{{name}}"
            hint: "The school's staff directory. Every department/course/club refers to a teacher by their exact name here — edit someone's email, room, or photo once and it updates everywhere they're listed."
            fields:
              - { label: "Name", name: "name", widget: "string" }
              - { label: "Email", name: "email", widget: "string" }
              - { label: "Room", name: "room", widget: "string" }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Optional profile picture. Leave blank to show initials instead."

      - name: "clubs"
        label: "Clubs & Organizations (All Pathways)"
        file: "content/clubs.json"
        fields:
          - label: "Clubs"
            name: "clubs"
            widget: "list"
            summary: "{{name}}"
            hint: "These show on every department page, in addition to that department's own clubs. Use this for a club/organization that isn't specific to one pathway, like NTHS."
            fields: *clubFields
